name: "[prod] Deploy delegator"

on:
  push:
    branches:
      - prod

jobs:
  deploy_testnet_delegator:
    uses: ./.github/workflows/delegator-app.yaml
    with:
      SWR_ORGANIZATION: prod-qubetics
      ARGOCD_BRANCH: prod
      HUAWEI_REGION: "ap-southeast-1"
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Delegator/delegator-deployment.yaml
      HUAWEI_IMAGE: prod-qubetics-delegator
      DOCKER_USERNAME: ap-southeast-1@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.PROD_DELEGATOR_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
